name: Update profile card

on:
  schedule:
    - cron: "37 4 * * *"        # daily, ~05:37 Berlin time
  workflow_dispatch:             # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths: [config.json, ascii.txt, ascii_light.txt, generate.py, .github/workflows/update-card.yml]

permissions:
  contents: write

concurrency:
  group: update-card
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render SVGs with fresh GitHub stats
        run: python3 generate.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update profile card"
            git push
          fi
